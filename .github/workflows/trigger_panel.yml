name: Build and publish the Trigger Panel

# Builds the cross-platform EDAMAME Trigger Panel (a convenience GUI that
# starts/stops the security demo triggers under tests/security/triggers and
# runs their cleanup.py, for authorized local detection testing only) and,
# on an operator dispatch, uploads the signed bundles to an EXISTING GitHub
# release's assets.
#
# Like every other workflow, each job starts with `Setup EDAMAME Posture`
# (attack pattern detection on the job; Hub registration so the org IP allow
# list admits the runner) and ends with the `Dump EDAMAME Posture sessions`
# vulnerability gate.
#   * build-macos / build-windows / build-linux: build + sign + upload the
#     bundle as an Actions artifact. The version is read from Cargo.toml. A
#     push that changes the panel or the triggers runs only these, so a
#     trigger change is validated without touching any release.
#   * publish: runs ONLY on a workflow_dispatch with dry_run=false (an
#     operator, or edamame_app/release_all.sh after Phase 1). It resolves the
#     target release, downloads the three bundles, computes SHA256SUMS, and
#     uploads every bundle plus SHA256SUMS to the release.
#
# This workflow NEVER creates or moves a tag or release, never dispatches a
# release_*.yml. It only ADDS assets that are missing from the target release;
# an asset already present is left untouched (published assets are immutable --
# their checksum is fixed).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the panel assets to (e.g. v2.0.7). Empty = the repo''s latest release.'
        type: string
        default: ''
      dry_run:
        description: 'Build + sign + smoke-test only; do not upload any asset to the release.'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'tools/trigger_panel/**'
      - 'tests/security/triggers/**'
      - '.github/workflows/trigger_panel.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:

  # ===========================================================================
  # Build legs: build + sign + upload an Actions artifact. No release API here
  # (it is IP-allow-list-blocked on a hosted runner until the publish job
  # registers the runner). Version comes from Cargo.toml.
  # ===========================================================================

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      # Every job runs the EDAMAME Posture action first, like the other
      # workflows (self-hosted-runners / workspace rules): it watches the job
      # and registers the runner so the org IP allow list admits it.
      - name: Setup EDAMAME Posture
        uses: edamametechnologies/edamame_posture_action@v1
        with:
          edamame_user: ${{ vars.EDAMAME_POSTURE_USER }}
          edamame_domain: ${{ vars.EDAMAME_POSTURE_DOMAIN }}
          edamame_pin: ${{ secrets.EDAMAME_POSTURE_PIN }}
          edamame_id: ${{ github.run_id }}
          network_scan: true
          auto_whitelist: true
          auto_whitelist_artifact_name: edamame-auto-whitelist-trigger-panel-macos
          auto_remediate: true
          checkout: true
          token: ${{ secrets.DEV_GITHUB_TOKEN }}
          wait_for_api: true
          wait_repository: edamametechnologies/edamame_core
          wait_for_https: true
          packet_capture: true
          vulnerability_detection: true
          vulnerability_detection_interval: '60'
          agentic_mode: analyze
          agentic_provider: edamame
          agentic_interval: 600
        env:
          EDAMAME_LLM_API_KEY: ${{ secrets.EDAMAME_LLM_API_KEY }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Resolve panel version from Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep '^version =' ./Cargo.toml | head -n1 | awk '{print $3}' | tr -d '"')
          [ -n "$VERSION" ] || { echo "::error::could not read version from Cargo.toml"; exit 1; }
          echo "EDAMAME_PANEL_VERSION=$VERSION" >> "$GITHUB_ENV"

      # Developer ID Application signing + notarization (NO provisioning
      # profile -- the panel is a plain tkinter app and needs no Endpoint
      # Security entitlement). Keychain + notarytool setup mirrors
      # release_others.yml's "Setup signing for macOS": under umask 077 with a
      # trap that removes the decoded key material when the step ends (FP-CI-23).
      - name: Setup signing for macOS
        shell: bash
        run: |
          umask 077
          trap 'rm -f certificate_application.cer certificate_application.key certificate_application.p12 appstore_connect_api_key.p8' EXIT

          echo ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CER }} | base64 --decode > certificate_application.cer
          echo ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_KEY }} | base64 --decode > certificate_application.key
          openssl pkcs12 -export -name zup -in certificate_application.cer -inkey certificate_application.key -passin pass:${{ secrets.APPLE_P12_PASSWORD }} -out certificate_application.p12 -passout pass:${{ secrets.MACOS_KEYCHAIN_PASSWORD }}

          export KEYCHAIN_PATH=/tmp/trigger-panel-signing.keychain-db
          security create-keychain -p "${{ secrets.MACOS_KEYCHAIN_PASSWORD }}" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "${{ secrets.MACOS_KEYCHAIN_PASSWORD }}" $KEYCHAIN_PATH
          security import certificate_application.p12 -P "${{ secrets.APPLE_P12_PASSWORD }}" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          echo ${{ secrets.APPLE_APPSTORE_CONNECT_API_KEY }} | base64 --decode > appstore_connect_api_key.p8
          xcrun notarytool store-credentials -k appstore_connect_api_key.p8 -d ${{ secrets.APPLE_APPSTORE_CONNECT_API_KEY_ID }} -i ${{ secrets.APPLE_APPSTORE_CONNECT_API_ISSUER_ID }} Edamame

      - name: Build the macOS app (signed + notarized)
        shell: bash
        env:
          EDAMAME_CODESIGN_IDENTITY: 'Developer ID Application: Edamame Technologies (WSL782B48J)'
          EDAMAME_NOTARIZE_PROFILE: Edamame
        run: |
          set -euo pipefail
          bash tools/trigger_panel/build_macos_app.sh "$RUNNER_TEMP/panel_dist" | tee "$RUNNER_TEMP/build.log"
          ARTIFACT="$(sed -n 's/^ARTIFACT=//p' "$RUNNER_TEMP/build.log" | tail -n1)"
          [ -n "$ARTIFACT" ] && [ -f "$ARTIFACT" ] || { echo "::error::macOS build produced no artifact"; exit 1; }
          echo "ARTIFACT=$ARTIFACT" >> "$GITHUB_ENV"

      - name: Upload the built bundle as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: panel-macos
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error

      - name: Check job status before posture dump
        id: job_status_check
        if: failure()
        run: echo "job_was_failing=true" >> "$GITHUB_OUTPUT"

      - name: Dump EDAMAME Posture sessions
        id: dump_sessions
        if: always()
        uses: edamametechnologies/edamame_posture_action@v1
        with:
          dump_sessions_log: true
          promote_exceptions: ${{ vars.EDAMAME_AUTO_WHITELIST_PROMOTE_EXCEPTIONS }}
          dump_vulnerability_findings: true
          exit_on_vulnerability_findings: true

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # Every job runs the EDAMAME Posture action first, like the other
      # workflows (self-hosted-runners / workspace rules): it watches the job
      # and registers the runner so the org IP allow list admits it.
      - name: Setup EDAMAME Posture
        uses: edamametechnologies/edamame_posture_action@v1
        with:
          edamame_user: ${{ vars.EDAMAME_POSTURE_USER }}
          edamame_domain: ${{ vars.EDAMAME_POSTURE_DOMAIN }}
          edamame_pin: ${{ secrets.EDAMAME_POSTURE_PIN }}
          edamame_id: ${{ github.run_id }}
          network_scan: true
          auto_whitelist: true
          auto_whitelist_artifact_name: edamame-auto-whitelist-trigger-panel-windows
          auto_remediate: true
          checkout: true
          token: ${{ secrets.DEV_GITHUB_TOKEN }}
          wait_for_api: true
          wait_repository: edamametechnologies/edamame_core
          wait_for_https: true
          packet_capture: true
          vulnerability_detection: true
          vulnerability_detection_interval: '60'
          agentic_mode: analyze
          agentic_provider: edamame
          agentic_interval: 600
        env:
          EDAMAME_LLM_API_KEY: ${{ secrets.EDAMAME_LLM_API_KEY }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Resolve panel version from Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep '^version =' ./Cargo.toml | head -n1 | awk '{print $3}' | tr -d '"')
          [ -n "$VERSION" ] || { echo "::error::could not read version from Cargo.toml"; exit 1; }
          echo "EDAMAME_PANEL_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Setup .NET for Windows
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install AzureSignTool
        shell: pwsh
        run: |
          if (-not (dotnet tool list --global | Select-String -Pattern 'AzureSignTool')) {
            dotnet tool install --global AzureSignTool
          }

      # Build the launcher with MSVC, Authenticode-sign it with AzureSignTool
      # (same AZURE_SIGN_* secrets as release_others.yml).
      - name: Build the Windows bundle (signed)
        shell: pwsh
        env:
          AZURE_SIGN_TENANT_ID: ${{ secrets.AZURE_SIGN_TENANT_ID }}
          AZURE_SIGN_KEY_VAULT_URI: ${{ secrets.AZURE_SIGN_KEY_VAULT_URI }}
          AZURE_SIGN_CLIENT_ID: ${{ secrets.AZURE_SIGN_CLIENT_ID }}
          AZURE_SIGN_CLIENT_SECRET: ${{ secrets.AZURE_SIGN_CLIENT_SECRET }}
          AZURE_SIGN_CERT_NAME: ${{ secrets.AZURE_SIGN_CERT_NAME }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = & tools/trigger_panel/build_windows.ps1 -DistDir "$env:RUNNER_TEMP/panel_dist"
          $out | Tee-Object -FilePath "$env:RUNNER_TEMP/build.log"
          $line = ($out | Select-String -Pattern '^ARTIFACT=').Line | Select-Object -Last 1
          if (-not $line) { Write-Error 'Windows build produced no artifact'; exit 1 }
          $artifact = $line -replace '^ARTIFACT=', ''
          if (-not (Test-Path $artifact)) { Write-Error "Artifact not found: $artifact"; exit 1 }
          "ARTIFACT=$artifact" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload the built bundle as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: panel-windows
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error

      - name: Check job status before posture dump
        id: job_status_check
        if: failure()
        run: echo "job_was_failing=true" >> "$GITHUB_OUTPUT"

      - name: Dump EDAMAME Posture sessions
        id: dump_sessions
        if: always()
        uses: edamametechnologies/edamame_posture_action@v1
        with:
          dump_sessions_log: true
          promote_exceptions: ${{ vars.EDAMAME_AUTO_WHITELIST_PROMOTE_EXCEPTIONS }}
          dump_vulnerability_findings: true
          exit_on_vulnerability_findings: true

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Every job runs the EDAMAME Posture action first, like the other
      # workflows (self-hosted-runners / workspace rules): it watches the job
      # and registers the runner so the org IP allow list admits it.
      - name: Setup EDAMAME Posture
        uses: edamametechnologies/edamame_posture_action@v1
        with:
          edamame_user: ${{ vars.EDAMAME_POSTURE_USER }}
          edamame_domain: ${{ vars.EDAMAME_POSTURE_DOMAIN }}
          edamame_pin: ${{ secrets.EDAMAME_POSTURE_PIN }}
          edamame_id: ${{ github.run_id }}
          network_scan: true
          auto_whitelist: true
          auto_whitelist_artifact_name: edamame-auto-whitelist-trigger-panel-linux
          auto_remediate: true
          checkout: true
          token: ${{ secrets.DEV_GITHUB_TOKEN }}
          wait_for_api: true
          wait_repository: edamametechnologies/edamame_core
          wait_for_https: true
          packet_capture: true
          vulnerability_detection: true
          vulnerability_detection_interval: '60'
          agentic_mode: analyze
          agentic_provider: edamame
          agentic_interval: 600
        env:
          EDAMAME_LLM_API_KEY: ${{ secrets.EDAMAME_LLM_API_KEY }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Resolve panel version from Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep '^version =' ./Cargo.toml | head -n1 | awk '{print $3}' | tr -d '"')
          [ -n "$VERSION" ] || { echo "::error::could not read version from Cargo.toml"; exit 1; }
          echo "EDAMAME_PANEL_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build the Linux bundle (no signing)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rsync
          bash tools/trigger_panel/build_linux.sh "$RUNNER_TEMP/panel_dist" | tee "$RUNNER_TEMP/build.log"
          ARTIFACT="$(sed -n 's/^ARTIFACT=//p' "$RUNNER_TEMP/build.log" | tail -n1)"
          [ -n "$ARTIFACT" ] && [ -f "$ARTIFACT" ] || { echo "::error::Linux build produced no artifact"; exit 1; }
          echo "ARTIFACT=$ARTIFACT" >> "$GITHUB_ENV"

      - name: Upload the built bundle as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: panel-linux
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error

      - name: Check job status before posture dump
        id: job_status_check
        if: failure()
        run: echo "job_was_failing=true" >> "$GITHUB_OUTPUT"

      - name: Dump EDAMAME Posture sessions
        id: dump_sessions
        if: always()
        uses: edamametechnologies/edamame_posture_action@v1
        with:
          dump_sessions_log: true
          promote_exceptions: ${{ vars.EDAMAME_AUTO_WHITELIST_PROMOTE_EXCEPTIONS }}
          dump_vulnerability_findings: true
          exit_on_vulnerability_findings: true

  # ===========================================================================
  # Publish: operator dispatch only. Registers the runner with the Hub (adds
  # its IP to the org allow list so the release API is reachable), resolves the
  # target release, then uploads the built bundles + SHA256SUMS.
  # ===========================================================================
  publish:
    needs: [build-macos, build-windows, build-linux]
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Every job runs the EDAMAME Posture action first, like the other
      # workflows (self-hosted-runners / workspace rules): it watches the job
      # and registers the runner so the org IP allow list admits it.
      - name: Setup EDAMAME Posture
        uses: edamametechnologies/edamame_posture_action@v1
        with:
          edamame_user: ${{ vars.EDAMAME_POSTURE_USER }}
          edamame_domain: ${{ vars.EDAMAME_POSTURE_DOMAIN }}
          edamame_pin: ${{ secrets.EDAMAME_POSTURE_PIN }}
          edamame_id: ${{ github.run_id }}
          network_scan: true
          auto_whitelist: true
          auto_whitelist_artifact_name: edamame-auto-whitelist-trigger-panel-publish
          auto_remediate: true
          checkout: true
          token: ${{ secrets.DEV_GITHUB_TOKEN }}
          wait_for_api: true
          wait_repository: edamametechnologies/edamame_core
          wait_for_https: true
          packet_capture: true
          vulnerability_detection: true
          vulnerability_detection_interval: '60'
          agentic_mode: analyze
          agentic_provider: edamame
          agentic_interval: 600
        env:
          EDAMAME_LLM_API_KEY: ${{ secrets.EDAMAME_LLM_API_KEY }}

      - name: Resolve the target release tag
        id: pick
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-}"
          if [ -z "$TAG" ]; then
            # Latest published release of this repo. A lookup failure is an
            # error, not "no release" (same discipline as release_lookup.sh).
            TAG="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
            if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
              echo "::error::Could not resolve the latest release of ${GITHUB_REPOSITORY}."
              exit 1
            fi
            echo "Resolved latest release tag: $TAG"
          fi
          # Confirm the release exists; release_lookup.sh fails on anything but
          # a definite 404, which it reports as exists=false. This workflow
          # never creates a release.
          EXISTS="$(bash .github/scripts/release_lookup.sh release "${GITHUB_REPOSITORY}" "$TAG" | sed -n 's/^exists=//p')"
          if [ "$EXISTS" != "true" ]; then
            echo "::error::Release $TAG does not exist in ${GITHUB_REPOSITORY}; this workflow only uploads assets to an existing release, it does not create one."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download the built bundles
        uses: actions/download-artifact@v4
        with:
          pattern: panel-*
          path: panel-artifacts
          merge-multiple: true

      - name: Compute SHA256SUMS
        id: sums
        shell: bash
        env:
          VERSION: ${{ steps.pick.outputs.version }}
        run: |
          set -euo pipefail
          SUMS="trigger-panel-SHA256SUMS-${VERSION}.txt"
          cd panel-artifacts
          # Sorted, base names only, so the file matches the uploaded assets.
          find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort | while IFS= read -r f; do
            sha256sum "$f"
          done > "../$SUMS"
          cd ..
          echo "Computed $SUMS:"
          cat "$SUMS"
          echo "name=$SUMS" >> "$GITHUB_OUTPUT"

      # Published assets are IMMUTABLE for a given version. A retry must ADD
      # what is missing, never replace what is there: skip an asset already on
      # the release (exact-match grep -qxF), upload the rest without --clobber.
      # Mirrors release_others.yml's "Upload assets to release (Windows)".
      - name: Upload the bundles and SHA256SUMS to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.pick.outputs.tag }}
          SUMS: ${{ steps.sums.outputs.name }}
        run: |
          set -euo pipefail
          # The SHA256SUMS file was written to the workspace root by the
          # previous step; the three bundles are in panel-artifacts/.
          EXISTING="$(bash .github/scripts/release_lookup.sh assets "${GITHUB_REPOSITORY}" "$TAG")"
          UPLOADED=0
          for ASSET_PATH in panel-artifacts/* "$SUMS"; do
            ASSET_NAME="$(basename "$ASSET_PATH")"
            if printf '%s\n' "$EXISTING" | grep -qxF "$ASSET_NAME"; then
              echo "SKIP (already published, checksum is fixed): $ASSET_NAME"
              continue
            fi
            gh release upload "$TAG" "$ASSET_PATH" --repo "${GITHUB_REPOSITORY}"
            UPLOADED=$((UPLOADED + 1))
          done
          echo "Uploaded $UPLOADED new asset(s) to $TAG."

          # Verify every expected asset is present afterwards.
          AFTER="$(bash .github/scripts/release_lookup.sh assets "${GITHUB_REPOSITORY}" "$TAG")"
          for ASSET_PATH in panel-artifacts/*; do
            ASSET_NAME="$(basename "$ASSET_PATH")"
            printf '%s\n' "$AFTER" | grep -qxF "$ASSET_NAME" || { echo "::error::asset not on release after upload: $ASSET_NAME"; exit 1; }
          done

      - name: Check job status before posture dump
        id: job_status_check
        if: failure()
        run: echo "job_was_failing=true" >> "$GITHUB_OUTPUT"

      - name: Dump EDAMAME Posture sessions
        id: dump_sessions
        if: always()
        uses: edamametechnologies/edamame_posture_action@v1
        with:
          dump_sessions_log: true
          promote_exceptions: ${{ vars.EDAMAME_AUTO_WHITELIST_PROMOTE_EXCEPTIONS }}
          dump_vulnerability_findings: true
          exit_on_vulnerability_findings: true
