name: Build and publish the EDAMAME Attack Simulator

# Builds the EDAMAME Attack Simulator (the demo GUI that starts and stops the
# security demo triggers under tests/security/triggers and follows each one
# until EDAMAME reports it) and, on an operator dispatch, publishes the signed
# bundles to a release of edamametechnologies/edamame_security plus stable S3
# links.
#
# The app's source lives in edamame_security (tools/attack_simulator, next to
# the product it demonstrates); the triggers it bundles and the signing
# credentials live here, so the build runs here: every leg checks out
# edamame_security at `simulator_ref` into ./simulator beside this repository.
# The Attack Simulator replaces the Trigger Panel (tools/trigger_panel, retired
# in 2.0.8); `retire_trigger_panel` removes the panel's published files.
#
# Like every other workflow, each job starts with `Setup EDAMAME Posture`
# (attack pattern detection on the job; Hub registration so the org IP allow
# list admits the runner) and ends with the `Dump EDAMAME Posture sessions`
# vulnerability gate.
#   * build-macos / build-windows / build-linux: test, build, sign, and upload
#     the bundle as an Actions artifact. The version is the simulator's own
#     (tools/attack_simulator/VERSION in edamame_security). The scenario texts
#     come from tests/security/triggers/catalog.json, the source of truth of
#     what each trigger does; the Linux leg checks it against the triggers and
#     the CVE gate (test_trigger_catalog.py). A push that changes the
#     triggers, the gate or this workflow runs only these, so a trigger change
#     that leaves the catalog behind fails without touching any release.
#   * publish: runs ONLY on a workflow_dispatch with dry_run=false (an
#     operator, or edamame_app/release_all.sh after Phase 1). It resolves the
#     target edamame_security release, uploads every bundle plus SHA256SUMS to
#     it, and mirrors them to s3://edamame/attack-simulator/.
#
# This workflow NEVER creates or moves a tag or release, never dispatches a
# release_*.yml. It only ADDS assets that are missing from the target release;
# an asset already present is left untouched (published assets are immutable --
# their checksum is fixed). The only deletions are the retired Trigger Panel's
# files, and only when `retire_trigger_panel` is set.

on:
  workflow_dispatch:
    inputs:
      simulator_ref:
        description: 'edamame_security ref to build the simulator from.'
        type: string
        default: 'main'
      tag:
        description: 'edamame_security release tag to attach the bundles to (e.g. v2.0.8). Empty = its latest release.'
        type: string
        default: ''
      dry_run:
        description: 'Build + sign + test only; do not publish anything.'
        type: boolean
        default: false
      retire_trigger_panel:
        description: 'After publishing, delete the retired Trigger Panel bundles from this repository''s releases and from s3://edamame/trigger-panel/.'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'tests/security/triggers/**'
      - 'tests/security/run_cve_detection.sh'
      - 'tests/security/run_divergence_detection.sh'
      - 'tests/security/check_gate.py'
      - 'tests/security/test_trigger_catalog.py'
      - '.github/workflows/attack_simulator.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# contents: write is for the Trigger Panel retirement (this repository's own
# release assets); the simulator's release is in edamame_security and is
# written with a token that can reach it.
permissions:
  contents: write

env:
  SIMULATOR_REPO: edamametechnologies/edamame_security

jobs:

  # ===========================================================================
  # Build legs: test + build + sign + upload an Actions artifact. No release
  # API here (it is IP-allow-list-blocked on a hosted runner until the publish
  # job registers the runner).
  # ===========================================================================

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      # Every job runs the EDAMAME Posture action first, like the other
      # workflows (self-hosted-runners / workspace rules): it watches the job
      # and registers the runner so the org IP allow list admits it.
      - name: Setup EDAMAME Posture
        uses: edamametechnologies/edamame_posture_action@v1
        with:
          edamame_user: ${{ vars.EDAMAME_POSTURE_USER }}
          edamame_domain: ${{ vars.EDAMAME_POSTURE_DOMAIN }}
          edamame_pin: ${{ secrets.EDAMAME_POSTURE_PIN }}
          edamame_id: ${{ github.run_id }}
          network_scan: true
          auto_whitelist: true
          auto_whitelist_artifact_name: edamame-auto-whitelist-attack-simulator-macos
          auto_remediate: true
          checkout: true
          token: ${{ secrets.DEV_GITHUB_TOKEN }}
          wait_for_api: true
          wait_repository: edamametechnologies/edamame_core
          wait_for_https: true
          packet_capture: true
          vulnerability_detection: true
          vulnerability_detection_interval: '60'
          agentic_mode: analyze
          agentic_provider: edamame
          agentic_interval: 600
        env:
          EDAMAME_LLM_API_KEY: ${{ secrets.EDAMAME_LLM_API_KEY }}

      - name: Check out the simulator (edamame_security)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SIMULATOR_REPO }}
          ref: ${{ inputs.simulator_ref || 'main' }}
          path: simulator
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Resolve the simulator version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < simulator/tools/attack_simulator/VERSION)"
          [ -n "$VERSION" ] || { echo "::error::tools/attack_simulator/VERSION is empty"; exit 1; }
          echo "EDAMAME_SIMULATOR_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "EDAMAME_TRIGGERS_DIR=$GITHUB_WORKSPACE/tests/security/triggers" >> "$GITHUB_ENV"

      - name: Run the simulator unit tests
        shell: bash
        run: |
          set -euo pipefail
          # uv's standalone CPython ships tkinter (the simulator needs it); the
          # runners' system python may not, so run the tests through uv. The
          # tests check the catalog against this repository's triggers.
          uv python install 3.11
          uv run --no-project --python 3.11 -- python -m unittest discover -s simulator/tests/attack_simulator -v

      # Developer ID Application signing + notarization (NO provisioning
      # profile -- the simulator is a plain tkinter app and needs no Endpoint
      # Security entitlement). Keychain + notarytool setup mirrors
      # release_others.yml's "Setup signing for macOS": under umask 077 with a
      # trap that removes the decoded key material when the step ends (FP-CI-23).
      - name: Setup signing for macOS
        shell: bash
        run: |
          umask 077
          trap 'rm -f certificate_application.cer certificate_application.key certificate_application.p12 appstore_connect_api_key.p8' EXIT

          echo ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CER }} | base64 --decode > certificate_application.cer
          echo ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_KEY }} | base64 --decode > certificate_application.key
          openssl pkcs12 -export -name zup -in certificate_application.cer -inkey certificate_application.key -passin pass:${{ secrets.APPLE_P12_PASSWORD }} -out certificate_application.p12 -passout pass:${{ secrets.MACOS_KEYCHAIN_PASSWORD }}

          export KEYCHAIN_PATH=/tmp/attack-simulator-signing.keychain-db
          security create-keychain -p "${{ secrets.MACOS_KEYCHAIN_PASSWORD }}" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "${{ secrets.MACOS_KEYCHAIN_PASSWORD }}" $KEYCHAIN_PATH
          security import certificate_application.p12 -P "${{ secrets.APPLE_P12_PASSWORD }}" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          echo ${{ secrets.APPLE_APPSTORE_CONNECT_API_KEY }} | base64 --decode > appstore_connect_api_key.p8
          xcrun notarytool store-credentials -k appstore_connect_api_key.p8 -d ${{ secrets.APPLE_APPSTORE_CONNECT_API_KEY_ID }} -i ${{ secrets.APPLE_APPSTORE_CONNECT_API_ISSUER_ID }} Edamame

      - name: Build the macOS app (signed + notarized)
        shell: bash
        env:
          EDAMAME_CODESIGN_IDENTITY: 'Developer ID Application: Edamame Technologies (WSL782B48J)'
          EDAMAME_NOTARIZE_PROFILE: Edamame
        run: |
          set -euo pipefail
          bash simulator/tools/attack_simulator/build_macos_app.sh "$RUNNER_TEMP/simulator_dist" | tee "$RUNNER_TEMP/build.log"
          ARTIFACT="$(sed -n 's/^ARTIFACT=//p' "$RUNNER_TEMP/build.log" | tail -n1)"
          [ -n "$ARTIFACT" ] && [ -f "$ARTIFACT" ] || { echo "::error::macOS build produced no artifact"; exit 1; }
          echo "ARTIFACT=$ARTIFACT" >> "$GITHUB_ENV"

      - name: Upload the built bundle as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: simulator-macos
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error

      - name: Check job status before posture dump
        id: job_status_check
        if: failure()
        run: echo "job_was_failing=true" >> "$GITHUB_OUTPUT"

      - name: Dump EDAMAME Posture sessions
        id: dump_sessions
        if: always()
        uses: edamametechnologies/edamame_posture_action@v1
        with:
          dump_sessions_log: true
          promote_exceptions: ${{ vars.EDAMAME_AUTO_WHITELIST_PROMOTE_EXCEPTIONS }}
          dump_vulnerability_findings: true
          exit_on_vulnerability_findings: true

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # Every job runs the EDAMAME Posture action first, like the other
      # workflows (self-hosted-runners / workspace rules): it watches the job
      # and registers the runner so the org IP allow list admits it.
      - name: Setup EDAMAME Posture
        uses: edamametechnologies/edamame_posture_action@v1
        with:
          edamame_user: ${{ vars.EDAMAME_POSTURE_USER }}
          edamame_domain: ${{ vars.EDAMAME_POSTURE_DOMAIN }}
          edamame_pin: ${{ secrets.EDAMAME_POSTURE_PIN }}
          edamame_id: ${{ github.run_id }}
          network_scan: true
          auto_whitelist: true
          auto_whitelist_artifact_name: edamame-auto-whitelist-attack-simulator-windows
          auto_remediate: true
          checkout: true
          token: ${{ secrets.DEV_GITHUB_TOKEN }}
          wait_for_api: true
          wait_repository: edamametechnologies/edamame_core
          wait_for_https: true
          packet_capture: true
          vulnerability_detection: true
          vulnerability_detection_interval: '60'
          agentic_mode: analyze
          agentic_provider: edamame
          agentic_interval: 600
        env:
          EDAMAME_LLM_API_KEY: ${{ secrets.EDAMAME_LLM_API_KEY }}

      - name: Check out the simulator (edamame_security)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SIMULATOR_REPO }}
          ref: ${{ inputs.simulator_ref || 'main' }}
          path: simulator
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Resolve the simulator version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < simulator/tools/attack_simulator/VERSION)"
          [ -n "$VERSION" ] || { echo "::error::tools/attack_simulator/VERSION is empty"; exit 1; }
          echo "EDAMAME_SIMULATOR_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "EDAMAME_TRIGGERS_DIR=$GITHUB_WORKSPACE/tests/security/triggers" >> "$GITHUB_ENV"

      - name: Run the simulator unit tests
        shell: bash
        run: |
          set -euo pipefail
          # uv's standalone CPython ships tkinter (the simulator needs it); the
          # runners' system python may not, so run the tests through uv.
          uv python install 3.11
          uv run --no-project --python 3.11 -- python -m unittest discover -s simulator/tests/attack_simulator -v

      - name: Setup .NET for Windows
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install AzureSignTool
        shell: pwsh
        run: |
          if (-not (dotnet tool list --global | Select-String -Pattern 'AzureSignTool')) {
            dotnet tool install --global AzureSignTool
          }

      # Build the launcher with MSVC, Authenticode-sign it with AzureSignTool
      # (same AZURE_SIGN_* secrets as release_others.yml).
      - name: Build the Windows bundle (signed)
        shell: pwsh
        env:
          AZURE_SIGN_TENANT_ID: ${{ secrets.AZURE_SIGN_TENANT_ID }}
          AZURE_SIGN_KEY_VAULT_URI: ${{ secrets.AZURE_SIGN_KEY_VAULT_URI }}
          AZURE_SIGN_CLIENT_ID: ${{ secrets.AZURE_SIGN_CLIENT_ID }}
          AZURE_SIGN_CLIENT_SECRET: ${{ secrets.AZURE_SIGN_CLIENT_SECRET }}
          AZURE_SIGN_CERT_NAME: ${{ secrets.AZURE_SIGN_CERT_NAME }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = & simulator/tools/attack_simulator/build_windows.ps1 -DistDir "$env:RUNNER_TEMP/simulator_dist"
          $out | Tee-Object -FilePath "$env:RUNNER_TEMP/build.log"
          $line = ($out | Select-String -Pattern '^ARTIFACT=').Line | Select-Object -Last 1
          if (-not $line) { Write-Error 'Windows build produced no artifact'; exit 1 }
          $artifact = $line -replace '^ARTIFACT=', ''
          if (-not (Test-Path $artifact)) { Write-Error "Artifact not found: $artifact"; exit 1 }
          "ARTIFACT=$artifact" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload the built bundle as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: simulator-windows
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error

      - name: Check job status before posture dump
        id: job_status_check
        if: failure()
        run: echo "job_was_failing=true" >> "$GITHUB_OUTPUT"

      - name: Dump EDAMAME Posture sessions
        id: dump_sessions
        if: always()
        uses: edamametechnologies/edamame_posture_action@v1
        with:
          dump_sessions_log: true
          promote_exceptions: ${{ vars.EDAMAME_AUTO_WHITELIST_PROMOTE_EXCEPTIONS }}
          dump_vulnerability_findings: true
          exit_on_vulnerability_findings: true

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Every job runs the EDAMAME Posture action first, like the other
      # workflows (self-hosted-runners / workspace rules): it watches the job
      # and registers the runner so the org IP allow list admits it.
      - name: Setup EDAMAME Posture
        uses: edamametechnologies/edamame_posture_action@v1
        with:
          edamame_user: ${{ vars.EDAMAME_POSTURE_USER }}
          edamame_domain: ${{ vars.EDAMAME_POSTURE_DOMAIN }}
          edamame_pin: ${{ secrets.EDAMAME_POSTURE_PIN }}
          edamame_id: ${{ github.run_id }}
          network_scan: true
          auto_whitelist: true
          auto_whitelist_artifact_name: edamame-auto-whitelist-attack-simulator-linux
          auto_remediate: true
          checkout: true
          token: ${{ secrets.DEV_GITHUB_TOKEN }}
          wait_for_api: true
          wait_repository: edamametechnologies/edamame_core
          wait_for_https: true
          packet_capture: true
          vulnerability_detection: true
          vulnerability_detection_interval: '60'
          agentic_mode: analyze
          agentic_provider: edamame
          agentic_interval: 600
        env:
          EDAMAME_LLM_API_KEY: ${{ secrets.EDAMAME_LLM_API_KEY }}

      - name: Check out the simulator (edamame_security)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SIMULATOR_REPO }}
          ref: ${{ inputs.simulator_ref || 'main' }}
          path: simulator
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Resolve the simulator version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < simulator/tools/attack_simulator/VERSION)"
          [ -n "$VERSION" ] || { echo "::error::tools/attack_simulator/VERSION is empty"; exit 1; }
          echo "EDAMAME_SIMULATOR_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "EDAMAME_TRIGGERS_DIR=$GITHUB_WORKSPACE/tests/security/triggers" >> "$GITHUB_ENV"

      - name: Run the simulator unit tests
        shell: bash
        run: |
          set -euo pipefail
          # uv's standalone CPython ships tkinter (the simulator needs it); the
          # runners' system python may not, so run the tests through uv.
          uv python install 3.11
          uv run --no-project --python 3.11 -- python -m unittest discover -s simulator/tests/attack_simulator -v

      # triggers/catalog.json is the source of truth of what each trigger does
      # and what the simulator shows; a trigger change that leaves it behind
      # (a new trigger without an entry, a gate check it no longer lists, a
      # platform the gate excludes) fails here. One leg is enough: the test
      # reads files only.
      - name: Check the trigger catalog against the triggers and the gate
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-project --python 3.11 -- python -m unittest discover -s tests/security -p 'test_trigger_catalog.py' -v

      - name: Build the Linux bundle (no signing)
        shell: bash
        run: |
          set -euo pipefail
          # rsync is pre-installed on ubuntu-latest; only reach for apt when it
          # is genuinely missing, and wait out the dpkg lock the posture action's
          # own install can still hold (the unguarded install raced it and failed
          # on the frontend lock).
          if ! command -v rsync >/dev/null 2>&1; then
            for _ in $(seq 1 60); do
              sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || break
              echo "waiting for the dpkg lock..."; sleep 5
            done
            sudo apt-get update
            sudo apt-get install -y rsync
          fi
          bash simulator/tools/attack_simulator/build_linux.sh "$RUNNER_TEMP/simulator_dist" | tee "$RUNNER_TEMP/build.log"
          ARTIFACT="$(sed -n 's/^ARTIFACT=//p' "$RUNNER_TEMP/build.log" | tail -n1)"
          [ -n "$ARTIFACT" ] && [ -f "$ARTIFACT" ] || { echo "::error::Linux build produced no artifact"; exit 1; }
          echo "ARTIFACT=$ARTIFACT" >> "$GITHUB_ENV"

      - name: Upload the built bundle as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: simulator-linux
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error

      - name: Check job status before posture dump
        id: job_status_check
        if: failure()
        run: echo "job_was_failing=true" >> "$GITHUB_OUTPUT"

      - name: Dump EDAMAME Posture sessions
        id: dump_sessions
        if: always()
        uses: edamametechnologies/edamame_posture_action@v1
        with:
          dump_sessions_log: true
          promote_exceptions: ${{ vars.EDAMAME_AUTO_WHITELIST_PROMOTE_EXCEPTIONS }}
          dump_vulnerability_findings: true
          exit_on_vulnerability_findings: true

  # ===========================================================================
  # Publish: operator dispatch only. Registers the runner with the Hub (adds
  # its IP to the org allow list so the release API is reachable), resolves the
  # target edamame_security release, then uploads the built bundles +
  # SHA256SUMS and mirrors them to S3.
  # ===========================================================================
  publish:
    needs: [build-macos, build-windows, build-linux]
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Every job runs the EDAMAME Posture action first, like the other
      # workflows (self-hosted-runners / workspace rules): it watches the job
      # and registers the runner so the org IP allow list admits it.
      - name: Setup EDAMAME Posture
        uses: edamametechnologies/edamame_posture_action@v1
        with:
          edamame_user: ${{ vars.EDAMAME_POSTURE_USER }}
          edamame_domain: ${{ vars.EDAMAME_POSTURE_DOMAIN }}
          edamame_pin: ${{ secrets.EDAMAME_POSTURE_PIN }}
          edamame_id: ${{ github.run_id }}
          network_scan: true
          auto_whitelist: true
          auto_whitelist_artifact_name: edamame-auto-whitelist-attack-simulator-publish
          auto_remediate: true
          checkout: true
          token: ${{ secrets.DEV_GITHUB_TOKEN }}
          wait_for_api: true
          wait_repository: edamametechnologies/edamame_core
          wait_for_https: true
          packet_capture: true
          vulnerability_detection: true
          vulnerability_detection_interval: '60'
          agentic_mode: analyze
          agentic_provider: edamame
          agentic_interval: 600
        env:
          EDAMAME_LLM_API_KEY: ${{ secrets.EDAMAME_LLM_API_KEY }}

      - name: Check out the simulator (edamame_security)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SIMULATOR_REPO }}
          ref: ${{ inputs.simulator_ref || 'main' }}
          path: simulator
          persist-credentials: false

      - name: Resolve the target release tag
        id: pick
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DEV_GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-}"
          if [ -z "$TAG" ]; then
            # Latest published release of edamame_security. A lookup failure
            # is an error, not "no release" (same discipline as
            # release_lookup.sh).
            TAG="$(gh api "repos/${SIMULATOR_REPO}/releases/latest" --jq '.tag_name')"
            if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
              echo "::error::Could not resolve the latest release of ${SIMULATOR_REPO}."
              exit 1
            fi
            echo "Resolved latest release tag: $TAG"
          fi
          # Confirm the release exists; release_lookup.sh fails on anything but
          # a definite 404, which it reports as exists=false. This workflow
          # never creates a release.
          EXISTS="$(bash .github/scripts/release_lookup.sh release "${SIMULATOR_REPO}" "$TAG" | sed -n 's/^exists=//p')"
          if [ "$EXISTS" != "true" ]; then
            echo "::error::Release $TAG does not exist in ${SIMULATOR_REPO}; this workflow only uploads assets to an existing release, it does not create one."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # The simulator is versioned on its own (tools/attack_simulator/VERSION
          # in edamame_security), not by the release tag: the bundles attach to
          # this release but carry the simulator version, so a new build never
          # has to clobber an immutable asset of an earlier one.
          VERSION="$(tr -d '[:space:]' < simulator/tools/attack_simulator/VERSION)"
          [ -n "$VERSION" ] || { echo "::error::tools/attack_simulator/VERSION is empty"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download the built bundles
        uses: actions/download-artifact@v4
        with:
          pattern: simulator-*
          path: simulator-artifacts
          merge-multiple: true

      - name: Compute SHA256SUMS
        id: sums
        shell: bash
        env:
          VERSION: ${{ steps.pick.outputs.version }}
        run: |
          set -euo pipefail
          SUMS="attack-simulator-SHA256SUMS-${VERSION}.txt"
          cd simulator-artifacts
          # Sorted, base names only, so the file matches the uploaded assets.
          find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort | while IFS= read -r f; do
            sha256sum "$f"
          done > "../$SUMS"
          cd ..
          echo "Computed $SUMS:"
          cat "$SUMS"
          echo "name=$SUMS" >> "$GITHUB_OUTPUT"

      # Published assets are IMMUTABLE for a given version. A retry must ADD
      # what is missing, never replace what is there: skip an asset already on
      # the release (exact-match grep -qxF), upload the rest without --clobber.
      - name: Upload the bundles and SHA256SUMS to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DEV_GITHUB_TOKEN }}
          TAG: ${{ steps.pick.outputs.tag }}
          SUMS: ${{ steps.sums.outputs.name }}
        run: |
          set -euo pipefail
          EXISTING="$(bash .github/scripts/release_lookup.sh assets "${SIMULATOR_REPO}" "$TAG")"
          UPLOADED=0
          for ASSET_PATH in simulator-artifacts/* "$SUMS"; do
            ASSET_NAME="$(basename "$ASSET_PATH")"
            if printf '%s\n' "$EXISTING" | grep -qxF "$ASSET_NAME"; then
              echo "SKIP (already published, checksum is fixed): $ASSET_NAME"
              continue
            fi
            gh release upload "$TAG" "$ASSET_PATH" --repo "${SIMULATOR_REPO}"
            UPLOADED=$((UPLOADED + 1))
          done
          echo "Uploaded $UPLOADED new asset(s) to ${SIMULATOR_REPO} $TAG."

          # Verify every expected asset is present afterwards.
          AFTER="$(bash .github/scripts/release_lookup.sh assets "${SIMULATOR_REPO}" "$TAG")"
          for ASSET_PATH in simulator-artifacts/* "$SUMS"; do
            ASSET_NAME="$(basename "$ASSET_PATH")"
            printf '%s\n' "$AFTER" | grep -qxF "$ASSET_NAME" || { echo "::error::asset not on release after upload: $ASSET_NAME"; exit 1; }
          done

      # Stable download links, like the app's standalone builds: under
      # s3://edamame/attack-simulator/ each bundle gets a versioned key and a
      # moving "-latest" key, each with a .sha256 sidecar in `shasum -c`
      # format, plus LATEST holding the version. The files are downloaded back
      # from the release, so S3 always serves exactly what the release
      # publishes (a re-run that skipped an asset already on the release still
      # mirrors that asset). The "-latest" keys only move when the tag is
      # edamame_security's latest release, so a dispatch for an older tag never
      # rolls them back.
      - name: Publish the bundles to S3 (versioned + latest)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DEV_GITHUB_TOKEN }}
          TAG: ${{ steps.pick.outputs.tag }}
          VERSION: ${{ steps.pick.outputs.version }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          BUCKET_PATH="s3://edamame/attack-simulator"
          LATEST_TAG="$(gh api "repos/${SIMULATOR_REPO}/releases/latest" --jq '.tag_name')"
          [ -n "$LATEST_TAG" ] && [ "$LATEST_TAG" != "null" ] || { echo "::error::cannot read the latest release"; exit 1; }
          MOVE_LATEST=false
          [ "$TAG" = "$LATEST_TAG" ] && MOVE_LATEST=true
          echo "Target $TAG, latest release $LATEST_TAG: moving the -latest keys: $MOVE_LATEST"

          mkdir -p s3_out
          cd s3_out
          # Only THIS simulator version's bundles: the release can carry several
          # simulator versions (independent versioning), so an unversioned glob
          # would pull them all. Mirror exactly the three for $VERSION.
          gh release download "$TAG" --repo "${SIMULATOR_REPO}" \
            -p "edamame-attack-simulator-*-${VERSION}.zip" \
            -p "edamame-attack-simulator-*-${VERSION}.tar.gz"
          shopt -s nullglob
          files=(edamame-attack-simulator-*-"${VERSION}".zip edamame-attack-simulator-*-"${VERSION}".tar.gz)
          [ "${#files[@]}" -eq 3 ] || { echo "::error::expected 3 bundles for $VERSION on $TAG, found ${#files[@]}"; exit 1; }
          for f in "${files[@]}"; do
            case "$f" in
              *-"${VERSION}".tar.gz) base="${f%-"${VERSION}".tar.gz}"; ext=tar.gz ;;
              *-"${VERSION}".zip)    base="${f%-"${VERSION}".zip}";    ext=zip ;;
              *) echo "::error::$f does not carry version $VERSION"; exit 1 ;;
            esac
            names=("$f")
            if [ "$MOVE_LATEST" = true ]; then names+=("${base}-latest.${ext}"); fi
            sha="$(sha256sum "$f" | awk '{print $1}')"
            for name in "${names[@]}"; do
              aws s3 cp "$f" "$BUCKET_PATH/$name" --acl public-read
              printf '%s  %s\n' "$sha" "$name" > "$name.sha256"
              aws s3 cp "$name.sha256" "$BUCKET_PATH/$name.sha256" --acl public-read
              echo "https://edamame.s3.eu-west-1.amazonaws.com/attack-simulator/$name"
            done
          done
          if [ "$MOVE_LATEST" = true ]; then
            echo "$VERSION" > LATEST
            aws s3 cp LATEST "$BUCKET_PATH/LATEST" --acl public-read
          fi

      # One-time retirement of the Trigger Panel this simulator replaces: its
      # bundles on this repository's releases and its S3 prefix. Runs only
      # when asked, and only after the simulator was published above, so
      # there is never a window with neither tool downloadable. Deletes by
      # exact asset-name pattern; a failed lookup stops it (release_lookup.sh).
      - name: Retire the Trigger Panel downloads
        if: ${{ inputs.retire_trigger_panel }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          REMOVED=0
          TAGS="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" --jq '.[].tag_name')"
          for T in $TAGS; do
            ASSETS="$(bash .github/scripts/release_lookup.sh assets "${GITHUB_REPOSITORY}" "$T")"
            while IFS= read -r NAME; do
              case "$NAME" in
                edamame-trigger-panel-*|trigger-panel-SHA256SUMS-*)
                  gh release delete-asset "$T" "$NAME" --repo "${GITHUB_REPOSITORY}" --yes
                  echo "removed $T/$NAME"
                  REMOVED=$((REMOVED + 1)) ;;
              esac
            done <<< "$ASSETS"
          done
          echo "Removed $REMOVED Trigger Panel asset(s) from ${GITHUB_REPOSITORY} releases."
          aws s3 rm "s3://edamame/trigger-panel/" --recursive
          echo "Removed s3://edamame/trigger-panel/."

      - name: Check job status before posture dump
        id: job_status_check
        if: failure()
        run: echo "job_was_failing=true" >> "$GITHUB_OUTPUT"

      - name: Dump EDAMAME Posture sessions
        id: dump_sessions
        if: always()
        uses: edamametechnologies/edamame_posture_action@v1
        with:
          dump_sessions_log: true
          promote_exceptions: ${{ vars.EDAMAME_AUTO_WHITELIST_PROMOTE_EXCEPTIONS }}
          dump_vulnerability_findings: true
          exit_on_vulnerability_findings: true
