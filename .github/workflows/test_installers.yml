name: Test Posture Installers

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      release_context:
        description: >-
          Set by release_all.sh Phase 2. Skips the package-manager jobs
          (Homebrew, Chocolatey) and gates on the GitHub release assets
          instead. A freshly pushed Chocolatey package sits in MODERATION and
          a Homebrew tap needs to propagate, so during a release neither
          serves the version being validated -- the gate would report on the
          PREVIOUS release. Outside a release these jobs still run on the
          6-hourly schedule, which is where the real user install path belongs.
        type: boolean
        default: false

# Auto cancel previous runs if they were not completed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FALLBACK_VERSION: "1.2.0"
  REPO_BASE: "https://github.com/edamametechnologies/edamame_posture_cli"

jobs:
  linux-apt:
    name: Ubuntu (APT package)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Determine latest version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${FALLBACK_VERSION}"
          LATEST_URL="${REPO_BASE}/releases/latest"
          if REDIRECT=$(curl -s -I "$LATEST_URL" | grep -i "^location:" | sed 's/location: *//i' | tr -d '\r'); then
            if TAG=$(echo "$REDIRECT" | grep -o "v[0-9]\+\.[0-9]\+\.[0-9]\+"); then
              VERSION="${TAG#v}"
              echo "Found latest version: ${VERSION}"
            else
              echo "Could not parse latest tag, using fallback ${VERSION}"
            fi
          else
            echo "Could not discover latest tag, using fallback ${VERSION}"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Install prerequisites
        shell: bash
        run: |
          wait_for_apt_locks() {
            echo "Checking for apt/dpkg locks..."
            local TIMEOUT=300
            local TIME_PASSED=0
            local LOCK_FILES=(
              "/var/lib/apt/lists/lock"
              "/var/lib/dpkg/lock-frontend"
              "/var/lib/dpkg/lock"
              "/var/cache/apt/archives/lock"
            )
            while [ $TIME_PASSED -lt $TIMEOUT ]; do
              local LOCKED=false
              if command -v fuser >/dev/null 2>&1; then
                for lock_file in "${LOCK_FILES[@]}"; do
                  if [ -f "$lock_file" ] && sudo fuser "$lock_file" >/dev/null 2>&1; then
                    LOCKED=true
                    break
                  fi
                done
              fi
              if [ "$LOCKED" = "false" ]; then
                if ! sudo dpkg --configure -a 2>/dev/null; then
                  LOCKED=true
                fi
              fi
              if [ "$LOCKED" = "false" ]; then
                echo "No apt/dpkg locks held, proceeding..."
                return 0
              fi
              echo "Waiting for apt/dpkg locks... ($TIME_PASSED/${TIMEOUT}s)"
              sleep 5
              TIME_PASSED=$((TIME_PASSED + 5))
            done
            return 1
          }
          
          run_apt() {
            local MAX_ATTEMPTS=10
            local ATTEMPTS=0
            while [ $ATTEMPTS -lt $MAX_ATTEMPTS ]; do
              ATTEMPTS=$((ATTEMPTS + 1))
              echo "apt-get $* (attempt $ATTEMPTS/$MAX_ATTEMPTS)"
              if ! wait_for_apt_locks; then sleep 5; continue; fi
              if sudo -E apt-get "$@"; then return 0; fi
              sleep 5
            done
            return 1
          }

          # Make the helpers available to subsequent steps.
          cat <<'EOF' >/tmp/apt_helpers.sh
          wait_for_apt_locks() {
            echo "Checking for apt/dpkg locks..."
            local TIMEOUT=300
            local TIME_PASSED=0
            local LOCK_FILES=(
              "/var/lib/apt/lists/lock"
              "/var/lib/dpkg/lock-frontend"
              "/var/lib/dpkg/lock"
              "/var/cache/apt/archives/lock"
            )
            while [ $TIME_PASSED -lt $TIMEOUT ]; do
              local LOCKED=false
              if command -v fuser >/dev/null 2>&1; then
                for lock_file in "${LOCK_FILES[@]}"; do
                  if [ -f "$lock_file" ] && sudo fuser "$lock_file" >/dev/null 2>&1; then
                    LOCKED=true
                    break
                  fi
                done
              fi
              if [ "$LOCKED" = "false" ]; then
                if ! sudo dpkg --configure -a 2>/dev/null; then
                  LOCKED=true
                fi
              fi
              if [ "$LOCKED" = "false" ]; then
                echo "No apt/dpkg locks held, proceeding..."
                return 0
              fi
              echo "Waiting for apt/dpkg locks... ($TIME_PASSED/${TIMEOUT}s)"
              sleep 5
              TIME_PASSED=$((TIME_PASSED + 5))
            done
            return 1
          }

          run_apt() {
            local MAX_ATTEMPTS=10
            local ATTEMPTS=0
            while [ $ATTEMPTS -lt $MAX_ATTEMPTS ]; do
              ATTEMPTS=$((ATTEMPTS + 1))
              echo "apt-get $* (attempt $ATTEMPTS/$MAX_ATTEMPTS)"
              if ! wait_for_apt_locks; then sleep 5; continue; fi
              if sudo -E apt-get "$@"; then return 0; fi
              sleep 5
            done
            return 1
          }
          EOF
          source /tmp/apt_helpers.sh
          
          export DEBIAN_FRONTEND=noninteractive
          wait_for_apt_locks
          run_apt update -qq
          run_apt install -y curl gnupg ca-certificates

      - name: Install edamame-posture via APT
        id: install
        run: |
          set -euo pipefail
          source /tmp/apt_helpers.sh
          curl -sL https://edamame.s3.eu-west-1.amazonaws.com/repo/public.key | \
            sudo gpg --dearmor -o /usr/share/keyrings/edamame.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/edamame.gpg] https://edamame.s3.eu-west-1.amazonaws.com/repo stable main" | \
            sudo tee /etc/apt/sources.list.d/edamame.list >/dev/null
          wait_for_apt_locks
          run_apt update -qq
          run_apt install -y edamame-posture

      - name: Verify binary is available
        id: verify
        run: |
          set -euo pipefail
          command -v edamame_posture
          edamame_posture get-core-version
          edamame_posture --help | head -n 20

      - name: Ensure service is running
        id: run
        run: |
          set -euo pipefail
          sudo systemctl daemon-reload || true
          sudo systemctl start edamame_posture.service || true
          sleep 5
          if sudo systemctl is-active --quiet edamame_posture.service; then
            echo "✅ edamame_posture service is running"
          else
            echo "❌ edamame_posture service is not active"
            sudo systemctl status edamame_posture.service --no-pager || true
            exit 1
          fi

      - name: Slack alerts
        if: ${{ always() && (steps.install.outcome != 'success' || steps.verify.outcome != 'success' || steps.run.outcome != 'success') }}
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: 'C072J0U9TH7'
          slack-message: |
            *Posture Installer Test (Ubuntu APT)*:
            - Installation: ${{ steps.install.outcome == 'success' && '✅ Success' || '❌ Failed' }}
            - Verification: ${{ steps.verify.outcome == 'success' && '✅ Success' || '❌ Failed' }}
            - Service: ${{ steps.run.outcome == 'success' && '✅ Success' || '❌ Failed' }}
            More details: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        continue-on-error: true

      - name: Fail job if tests failed
        if: ${{ always() && (steps.install.outcome != 'success' || steps.verify.outcome != 'success' || steps.run.outcome != 'success') }}
        run: |
          echo "❌ Tests for Ubuntu (APT) did not succeed"
          exit 1

  linux-apk:
    name: Alpine (APK package)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: alpine:3.19
    steps:
      - name: Prepare Alpine
        run: |
          set -euo pipefail
          apk add --no-cache curl ca-certificates bash
          update-ca-certificates

      - name: Add repository and install edamame-posture
        id: install
        run: |
          set -euo pipefail
          ARCH="$(uname -m)"
          REPO_URL="https://edamame.s3.eu-west-1.amazonaws.com/repo/alpine/v3.15/main"
          wget -q -O /etc/apk/keys/edamame.rsa.pub "${REPO_URL}/${ARCH}/edamame.rsa.pub" || true
          echo "${REPO_URL}" >> /etc/apk/repositories
          apk update
          apk add --no-cache edamame-posture || { echo "apk install failed"; exit 1; }

      - name: Verify binary is available
        id: verify
        run: |
          set -euo pipefail
          command -v edamame_posture
          edamame_posture get-core-version
          edamame_posture --help | head -n 20

      - name: Ensure service is running if rc-service is available (Alpine)
        id: run
        run: |
            set -euo pipefail
            # Check if rc-service is available
            if command -v rc-service >/dev/null 2>&1; then
                rc-service edamame_posture status
                rc-service edamame_posture start
                sleep 5
                if rc-service edamame_posture status | grep -q "started"; then
                    echo "✅ edamame_posture service is running"
                else
                    echo "❌ edamame_posture service is not active"
                    rc-service edamame_posture status --no-pager || true
                    exit 1
                fi
            fi

      - name: Slack alerts
        if: ${{ always() && (steps.install.outcome != 'success' || steps.verify.outcome != 'success' || steps.run.outcome != 'success') }}
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: 'C072J0U9TH7'
          slack-message: |
            *Posture Installer Test (Alpine APK)*:
            - Installation: ${{ steps.install.outcome == 'success' && '✅ Success' || '❌ Failed' }}
            - Verification: ${{ steps.verify.outcome == 'success' && '✅ Success' || '❌ Failed' }}
            - Service: ${{ steps.run.outcome == 'success' && '✅ Success' || '❌ Failed' }}
            More details: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        continue-on-error: true

      - name: Fail job if tests failed
        if: ${{ always() && (steps.install.outcome != 'success' || steps.verify.outcome != 'success' || steps.run.outcome != 'success') }}
        run: |
          echo "❌ Tests for Alpine (APK) did not succeed"
          exit 1

  linux-binary:
    name: Linux (direct binary)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Determine latest version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${FALLBACK_VERSION}"
          LATEST_URL="${REPO_BASE}/releases/latest"
          if REDIRECT=$(curl -s -I "$LATEST_URL" | grep -i "^location:" | sed 's/location: *//i' | tr -d '\r'); then
            if TAG=$(echo "$REDIRECT" | grep -o "v[0-9]\+\.[0-9]\+\.[0-9]\+"); then
              VERSION="${TAG#v}"
            fi
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Download binary artifact
        id: download
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          ASSET="edamame_posture-${VERSION}-x86_64-unknown-linux-gnu"
          URL="${REPO_BASE}/releases/download/v${VERSION}/${ASSET}"
          echo "Downloading ${URL}"
          curl -fsSL "${URL}" -o edamame_posture
          chmod +x edamame_posture
          ls -la edamame_posture

      - name: Verify binary runs
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          ./edamame_posture get-core-version
          ./edamame_posture --help | head -n 20

      - name: Slack alerts
        if: ${{ always() && (steps.download.outcome != 'success' || steps.verify.outcome != 'success') }}
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: 'C072J0U9TH7'
          slack-message: |
            *Posture Installer Test (Linux Binary)*:
            - Download: ${{ steps.download.outcome == 'success' && '✅ Success' || '❌ Failed' }}
            - Verification: ${{ steps.verify.outcome == 'success' && '✅ Success' || '❌ Failed' }}
            More details: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        continue-on-error: true

      - name: Fail job if tests failed
        if: ${{ always() && (steps.download.outcome != 'success' || steps.verify.outcome != 'success') }}
        run: |
          echo "❌ Tests for Linux (binary) did not succeed"
          exit 1

  macos-brew:
    name: macOS (Homebrew)
    runs-on: macos-latest
    if: ${{ inputs.release_context != true }}
    timeout-minutes: 25
    steps:
      - name: Install via Homebrew
        id: install
        run: |
          set -euo pipefail
          brew update
          # Fully-qualified name self-trusts the tap (Homebrew 6.0.0 Tap Trust)
          brew install --cask edamametechnologies/tap/edamame-posture

      - name: Verify binary is available
        id: verify
        run: |
          set -euo pipefail
          command -v edamame_posture
          edamame_posture get-core-version
          edamame_posture --help | head -n 20

      - name: Check background process (best-effort)
        id: run
        run: |
          set -euo pipefail
          pgrep -f edamame_posture || true

      - name: Slack alerts
        if: ${{ always() && (steps.install.outcome != 'success' || steps.verify.outcome != 'success' || steps.run.outcome != 'success') }}
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: 'C072J0U9TH7'
          slack-message: |
            *Posture Installer Test (macOS Homebrew)*:
            - Installation: ${{ steps.install.outcome == 'success' && '✅ Success' || '❌ Failed' }}
            - Verification: ${{ steps.verify.outcome == 'success' && '✅ Success' || '❌ Failed' }}
            - Background check: ${{ steps.run.outcome == 'success' && '✅ Success' || '❌ Failed' }}
            More details: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        continue-on-error: true

      - name: Fail job if tests failed
        if: ${{ always() && (steps.install.outcome != 'success' || steps.verify.outcome != 'success' || steps.run.outcome != 'success') }}
        run: |
          echo "❌ Tests for macOS (Homebrew) did not succeed"
          exit 1

  windows-choco:
    name: Windows (Chocolatey)
    runs-on: windows-latest
    if: ${{ inputs.release_context != true }}
    timeout-minutes: 25
    steps:
      - name: Install via Chocolatey
        id: install
        shell: pwsh
        run: |
          $maxRetries = 3
          $retryDelay = 30
          for ($i = 1; $i -le $maxRetries; $i++) {
            Write-Host "Chocolatey install attempt $i/$maxRetries"
            choco install edamame-posture -y --no-progress
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -lt $maxRetries) {
              Write-Host "Install failed, retrying in ${retryDelay}s..."
              Start-Sleep -Seconds $retryDelay
            } else {
              Write-Host "All install attempts failed"
              exit 1
            }
          }

      - name: Verify binary is available
        id: verify
        shell: pwsh
        run: |
          $exe = Get-Command edamame_posture.exe -ErrorAction Stop
          Write-Host "Binary path: $($exe.Source)"
          $versionOutput = & $exe.Source get-core-version 2>&1
          Write-Host "Version: $versionOutput"
          & $exe.Source --help | Select-Object -First 20
          $fileInfo = Get-Item $exe.Source
          Write-Host "Binary size: $($fileInfo.Length) bytes"
          if ($fileInfo.Length -lt 100000) {
            Write-Host "ERROR: Binary suspiciously small ($($fileInfo.Length) bytes)"
            exit 1
          }

      - name: Slack alerts
        if: ${{ always() && (steps.install.outcome != 'success' || steps.verify.outcome != 'success') }}
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: 'C072J0U9TH7'
          slack-message: |
            *Posture Installer Test (Windows Chocolatey)*:
            - Installation: ${{ steps.install.outcome == 'success' && '✅ Success' || '❌ Failed' }}
            - Verification: ${{ steps.verify.outcome == 'success' && '✅ Success' || '❌ Failed' }}
            More details: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        continue-on-error: true

      - name: Fail job if tests failed
        if: ${{ always() && (steps.install.outcome != 'success' || steps.verify.outcome != 'success') }}
        run: |
          echo "Tests for Windows (Chocolatey) did not succeed"
          exit 1

  # Release-gating path: validate the assets THIS release published, straight
  # from the GitHub release. Chocolatey moderates before listing and Homebrew
  # taps propagate, so gating a release on them gates on the PREVIOUS version.
  github-release:
    name: GitHub release assets
    if: ${{ inputs.release_context == true }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            asset: edamame_posture-VERSION-x86_64-unknown-linux-gnu
          - runner: windows-latest
            asset: edamame_posture-VERSION-x86_64-pc-windows-msvc.exe
    steps:
      # Resolve + download over PUBLIC endpoints with curl, never the gh API.
      #
      # The edamametechnologies org has an IP allow list, and GitHub-hosted
      # runners draw addresses outside it, so authenticated `gh release view`
      # intermittently returns "HTTP 403: ... organization has an IP allow
      # list" -- it failed on all three platforms the first time this job ran.
      # Public release reads carry no such restriction, which is why the
      # long-standing linux-apt job resolves versions the same way.
      - name: Resolve latest release
        id: rel
        shell: bash
        run: |
          set -euo pipefail
          REDIRECT="$(curl -sSI "https://github.com/edamametechnologies/edamame_posture_cli/releases/latest" \
            | grep -i '^location:' | sed 's/location: *//i' | tr -d '\r')"
          TAG="$(printf '%s' "$REDIRECT" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          if [[ -z "$TAG" ]]; then
            echo "Could not resolve latest release tag from: $REDIRECT"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Validating release $TAG"

      - name: Download and verify asset
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.rel.outputs.version }}"
          ASSET="${{ matrix.asset }}"
          ASSET="${ASSET/VERSION/$VERSION}"
          URL="https://github.com/edamametechnologies/edamame_posture_cli/releases/download/${{ steps.rel.outputs.tag }}/$ASSET"
          echo "Downloading $URL"
          # -f so a 404 is an error rather than a saved error page.
          curl -fsSL -o "$ASSET" "$URL"
          test -s "$ASSET"
          # Presence is not evidence: a truncated or HTML body still saves to
          # disk. Require the binary to actually run.
          chmod +x "$ASSET" || true
          ./"$ASSET" --version || ./"$ASSET" --help | head -n 5
          echo "OK: $ASSET is present and executable"

      - name: Slack alerts
        if: ${{ always() && steps.verify.outcome != 'success' }}
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: 'C072J0U9TH7'
          slack-message: |
            *Posture Release Asset Test (${{ matrix.runner }})*:
            - Asset verification: ❌ Failed
            More details: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        continue-on-error: true

      - name: Fail job if tests failed
        if: ${{ always() && steps.verify.outcome != 'success' }}
        run: |
          echo "Release asset test for ${{ matrix.runner }} did not succeed"
          exit 1
